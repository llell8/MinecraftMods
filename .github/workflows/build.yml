name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: creativestations-jar
          path: build/libs/*.jar
      # Also publish the plain mod jar on the Releases page (tag "latest"), easier to download than a zip
      - name: Publish latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          body: "Automatic build of ${{ github.sha }}. Download the jar without -sources."
          files: |
            build/libs/*.jar

  phoenix-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoenix-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-client-jar
          path: phoenix-client/build/libs/*.jar
      - name: Publish Phoenix release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phoenix-latest
          name: Phoenix Client (latest build)
          prerelease: true
          make_latest: false
          body: "Automatic build of ${{ github.sha }}."
          files: |
            phoenix-client/build/libs/*.jar

  phoenix-pvp-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Zips the committed pack/ as-is; run generate.py locally to change textures
      - run: cd phoenix-pvp-pack/pack && zip -r -X ../Phoenix-PvP.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-pvp-pack
          path: phoenix-pvp-pack/Phoenix-PvP.zip
      - name: Publish Phoenix PvP pack release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phoenix-pvp-latest
          name: Phoenix PvP resource pack (latest build)
          prerelease: true
          make_latest: false
          body: "Automatic build of ${{ github.sha }}. Drop the zip into .minecraft/resourcepacks (Minecraft 1.21.11)."
          files: |
            phoenix-pvp-pack/Phoenix-PvP.zip
